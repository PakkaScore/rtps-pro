<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

</head>
<body>

 6M10 11v6M14 11v6"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol><symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></symbol><symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol><symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.7-4 3-9 3s-9-1.3-9-3M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2z"/></symbol><symbol id="i-github" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.1.68-.22.68-.48v-1.7C6.73 20.07 6 18.5 6 18.5c-.67-1.7-1.64-2.15-1.64-2.15-.84-.57.06-.56.06-.56 1 .07 1.53 1.03 1.53 1.03.77 1.32 2.02.94 2.51.72.08-.56.3-.94.55-1.16-1.92-.22-3.94-.96-3.94-4.27 0-.94.33-1.71.88-2.31-.09-.22-.38-1.1.08-2.3 0 0 .72-.23 2.36.88a8.2 8.2 0 0 1 4.3 0c1.64-1.11 2.36-.88 2.36-.88.46 1.2.17 2.08.08 2.3.55.6.88 1.37.88 2.31 0 3.32-2.02 4.05-3.95 4.27.31.27.58.8.58 1.61v2.39c0 .26.18.58.69.48A10 10 0 0 0 12 2z"/></symbol></svg>
<header class="hdr">
  <div class="brand">
    <span class="mark"><svg><use href="#pmark"/></svg></span>
    <div><h1>RTPS Pro <span>by PakkaScore</span></h1><small data-i="app_sub"></small></div>
    <div class="langsw" id="langsw"><button data-lang="en">EN</button><button data-lang="hi">हिं</button></div>
    <button id="btnOptions" class="ib" title="Settings & Profile editor"><svg class="i"><use href="#i-gear"/></svg></button>
  </div>
  <div class="ctx" id="ctx"><div class="ctxrow"><span class="dot"></span><div><small class="k" data-i="detected"></small><b id="ctxTitle"></b><small id="ctxSub"></small></div><em id="ctxRight"></em></div><div class="reqnote hidden" id="reqNote"></div></div>
</header>

<main>
  <div id="bk" class="note bk hidden"><svg class="i sm"><use href="#i-db"/></svg><div><b data-i="bk_lbl"></b> — <span id="bkBody"></span><div class="bkbtns"><button id="bkNow" class="link" data-i="bk_now"></button><button id="bkLater" class="link mute" data-i="bk_later"></button></div></div></div>
  <div id="tip" class="note tip hidden"><svg class="i sm"><use href="#i-info"/></svg><div><b data-i="tip_lbl"></b> — <span id="tipBody"></span></div><button class="ib x hidden" id="tipClose"><svg class="i sm"><use href="#i-x"/></svg></button></div>
  <div id="rvFirefox" class="note review hidden"><svg class="i sm"><use href="#i-star"/></svg><div><b data-i="rv_t"></b> — <span id="rvBody"></span><div class="bkbtns"><button id="rvNow" class="link" data-i="rv_now"></button><button id="rvLater" class="link mute" data-i="rv_later"></button><button id="rvNever" class="link mute" data-i="rv_never"></button></div></div><button class="ib x" id="rvClose"><svg class="i sm"><use href="#i-x"/></svg></button></div>
  <div id="rvEdge" class="note review edge hidden"><svg class="i sm"><use href="#i-star"/></svg><div><b data-i="rv_t"></b> — <span id="rvBodyEdge"></span><div class="bkbtns"><button id="rvEdgeNow" class="link" data-i="rv_now_edge"></button><button id="rvEdgeLater" class="link mute" data-i="rv_later"></button><button id="rvEdgeNever" class="link mute" data-i="rv_never"></button></div></div><button class="ib x" id="rvEdgeClose"><svg class="i sm"><use href="#i-x"/></svg></button></div>
  <div id="rvGithub" class="note review gh hidden"><svg class="i sm"><use href="#i-github"/></svg><div><b data-i="gh_t"></b> — <span id="ghBody"></span><div class="bkbtns"><button id="ghNow" class="link" data-i="gh_now"></button><button id="ghLater" class="link mute" data-i="gh_later"></button><button id="ghNever" class="link mute" data-i="gh_never"></button></div></div><button class="ib x" id="ghClose"><svg class="i sm"><use href="#i-x"/></svg></button></div>

  <div class="lbl"><span data-i="profile"></span> <button id="btnChange" class="link" data-i="change"></button></div>
  <div class="picker" id="picker">
    <div class="prof-wrap">
      <button class="prof" id="curProf">
        <span class="av" id="avatar">?</span>
        <span class="pt"><b id="pName"></b><small id="pMeta"></small><span class="badges" id="pBadges"></span></span>
        <svg class="i chev"><use href="#i-chev"/></svg>
      </button>
      <div class="p-actbar" id="pActBar">
        <button id="btnDupCard" class="pa" data-i-title="dup_t"><svg class="i sm"><use href="#i-copy"/></svg><span data-i="dup_short"></span></button>
        <button id="btnEditCard" class="pa" data-i-title="edit_t"><svg class="i sm"><use href="#i-edit"/></svg><span data-i="edit_short"></span></button>
        <button id="btnDelCard" class="pa danger" data-i-title="del_t"><svg class="i sm"><use href="#i-trash"/></svg><span data-i="del_short"></span></button>
      </div>
    </div>
    <div class="list hidden" id="list">
      <div class="search"><svg class="i sm"><use href="#i-search"/></svg><input id="search" autocomplete="off"></div>
      <div id="items"></div>
    </div>
  </div>

  <div class="actions">
    <button id="btnOpenRtps" class="btn navy hidden"><svg class="i"><use href="#i-globe"/></svg><span><span data-i="open_rtps"></span><small data-i="open_rtps_sub"></small></span></button>
    <button id="btnFill" class="btn primary"><svg class="i"><use href="#i-bolt"/></svg><span><span data-i="autofill"></span><small data-i="autofill_sub"></small></span></button>
    <div class="saverow" id="saverow">
      <button id="btnSave" class="btn"><svg class="i"><use href="#i-save"/></svg><span><span id="saveLbl"></span><small id="saveSub"></small></span></button>
      <button id="btnNew" class="btn newbtn"><svg class="i"><use href="#i-plus"/></svg><span><span data-i="new_profile"></span><small data-i="new_profile_sub"></small></span></button>
    </div>
  </div>


  <div id="progress" class="prog hidden"><div class="top"><b data-i="filling"></b><span id="progTxt">0/0</span></div><div class="bar"><i></i></div><small id="progLbl"></small></div>


  <div id="result" class="result hidden">
    <span class="rico" id="resIco"><svg class="i"><use href="#i-check"/></svg></span>
    <div class="rtx"><b id="resTitle"></b><small id="resSub"></small><div id="resList" class="rlist"></div><a id="resHelp" class="reshelp hidden" href="https://pakkascore.github.io/rtps-pro/"><svg class="i sm"><use href="#i-help"/></svg><span data-i="help_res"></span> →</a></div>
    <button class="ib x" id="resClose"><svg class="i sm"><use href="#i-x"/></svg></button>
  </div>


  <div id="howto" class="howto hidden">
    <b data-i="howto_t"></b>
    <ol><li data-i="howto_1"></li><li data-i="howto_2"></li><li data-i="howto_3"></li><li data-i="howto_4"></li></ol>
    <span class="hint"><span data-i="howto_warn"></span><br><span data-i="howto_next"></span></span>
  </div>


  <div class="grid tiles four">
    <button id="btnExport" class="btn sm"><svg class="i"><use href="#i-export"/></svg><span><span data-i="export"></span><small data-i="export_sub"></small></span></button>
    <button id="btnImport" class="btn sm"><svg class="i"><use href="#i-import"/></svg><span><span data-i="import"></span><small data-i="import_sub"></small></span></button>
    <button id="btnClear" class="btn sm"><svg class="i"><use href="#i-broom"/></svg><span><span data-i="clear_form"></span><small data-i="clear_sub"></small></span></button>
    <button id="btnExample" class="btn sm"><svg class="i"><use href="#i-book"/></svg><span><span data-i="restore_example"></span><small data-i="restore_sub"></small></span></button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>

  <div class="kb-only" data-i="kb_hint"></div>
</main>
<div id="sheetBg" class="sheetbg hidden"></div>
<div id="sheet" class="sheet hidden">
  <div class="grab"></div>
  <h2 id="sheetTitle" data-i="sheet_t"></h2>
  <p class="sheetp" data-i="sheet_p"></p>
  <div id="sheetState" class="fstate"></div>
  <label class="flabel" for="newProfileName"><span data-i="name"></span> <small data-i="name_hint"></small></label>
  <input id="newProfileName" class="finput" data-i-ph="name_ph" autocomplete="off">
  <div id="nameCheck" class="ncheck hidden"></div>
  <div class="sheetbtns">
    <button id="sheetCancel" class="btn" data-i="cancel"></button>
    <button id="btnSaveNew" class="btn primary"><svg class="i"><use href="#i-save"/></svg><span><span data-i="save_from_form"></span></span></button>
  </div>
</div>
<div id="gsheet" class="sheet hidden">
  <div class="grab"></div>
  <h2 data-i="g_t"></h2>
  <p class="sheetp" id="gMsg"></p>
  <div class="xopts">
    <button id="gBetter" class="btn primary hidden"><svg class="i"><use href="#i-save"/></svg><span><span id="gBetterLbl"></span><small data-i="g_better_sub"></small></span></button>
    <button id="gNew" class="btn navy"><svg class="i"><use href="#i-plus"/></svg><span><span data-i="sheet_t"></span><small data-i="g_new_sub"></small></span></button>
    <button id="gOverride" class="btn danger"><svg class="i"><use href="#i-alert"/></svg><span><span id="gOverrideLbl"></span><small id="gOverrideSub"></small></span></button>
  </div>
  <div class="sheetbtns"><button id="gCancel" class="btn" data-i="cancel"></button></div>
</div>
<div id="xsheet" class="sheet hidden">
  <div class="grab"></div>
  <h2 data-i="exp_t"></h2>
  <p class="sheetp" data-i="exp_p"></p>
  <div class="xopts">
    <button id="xOne" class="btn"><svg class="i"><use href="#i-export"/></svg><span><span data-i="exp_one"></span><small id="xOneName"></small></span></button>
    <button id="xAll" class="btn primary"><svg class="i"><use href="#i-db"/></svg><span><span id="xAllLbl"></span><small data-i="exp_all_sub"></small></span></button>
  </div>
  <div class="sheetbtns"><button id="xCancel" class="btn" data-i="cancel"></button></div>
</div>
<div id="dupSheet" class="sheet hidden">
  <div class="grab"></div>
  <h2 data-i="dup_t"></h2>
  <p class="sheetp" data-i="dup_p"></p>
  <div id="dupState" class="fstate hidden"></div>
  <label class="flabel" for="dupName"><span data-i="name"></span> <small data-i="dup_same"></small></label>
  <input id="dupName" class="finput" data-i-ph="dup_ph" autocomplete="off">
  <div id="dupCheck" class="ncheck hidden"></div>
  <div class="sheetbtns">
    <button id="dupCancel" class="btn" data-i="cancel"></button>
    <button id="btnDupSave" class="btn primary"><svg class="i"><use href="#i-copy"/></svg><span><span data-i="dup_t"></span></span></button>
  </div>
</div>
<a id="lnkHelp" class="helpstrip" href="https://pakkascore.github.io/rtps-pro/"><span class="hq"><svg class="i"><use href="#i-help"/></svg></span><span class="ht"><b data-i="help_q"></b><small data-i="help_sub"></small></span><span class="harr">›</span></a>
<footer><span class="safe"><svg class="i sm"><use href="#i-lock"/></svg><span data-i="data_local"></span></span><a id="lnkBrand" class="wm" href="https://pakkascore.blogspot.com" title="pakkascore.blogspot.com">Pakka<b>Score</b> ↗</a></footer>
<div id="status" class="status"></div>
<script src="popup.js"></script>
</body>
</html>
